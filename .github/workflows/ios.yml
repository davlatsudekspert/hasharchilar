name: hasharchilar iOS

# iOS ilova (Capacitor, ios/App). Har push'da: simulyator uchun imzosiz build (kod iOS'da yig'ilishini tekshirish).
# Apple secret'lari bo'lsa (APPLE_TEAM_ID, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_API_KEY_P8):
# imzolangan arxiv → App Store Connect'ga yuklash (TestFlight). Sertifikat va profil Xcode tomonidan
# App Store Connect API kaliti orqali avtomatik yaratiladi (-allowProvisioningUpdates).
# Android deploy'iga (deploy.yml) ta'sir qilmaydi.
on:
  push:
    branches: [main, ios-app]
    paths:
      - 'src/**'
      - 'ios/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'vite.config.js'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKER_NAME: hasharchilar-api
  CLOUDFLARE_ACCOUNT_ID: 31c4b3d8ece4b65de515debc4552334a
  WORKERS_SUBDOMAIN_FALLBACK: davlatsudekspert
  # Build raqami har bir iOS run'da oshadi (App Store Connect talabi)
  BUILD_NUMBER: ${{ github.run_number }}
  MARKETING_VERSION: 1.0.${{ github.run_number }}

jobs:
  ios:
    name: iOS build (+ TestFlight)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Xcode
        run: |
          set -euo pipefail
          # Eng yangi barqaror Xcode (App Store hozirgi SDK talab qiladi)
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1 || true)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; fi
          xcodebuild -version

      - name: Bog'liqliklar
        run: npm ci

      - name: Public URL (workers.dev)
        id: url
        run: |
          set -euo pipefail
          URL=$(bash scripts/site-url.sh)
          if [ -z "$URL" ]; then echo "::error::Public URL bo'sh"; exit 1; fi
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "API: ${URL}"

      - name: Build (ilova uchun, API = workers.dev)
        env:
          VITE_API_BASE: ${{ steps.url.outputs.url }}
        run: npm run build

      - name: Capacitor sync (iOS)
        run: npx cap sync ios

      # Imzosiz simulyator build'i: Swift paketlari, plaginlar va resurslar yig'ilishini tekshiradi
      - name: Simulyator build (imzosiz)
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build | tail -40
          test -d build/sim/Build/Products/Release-iphonesimulator/App.app

      - name: Apple secret'lari bormi
        id: apple
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.APPLE_API_KEY_ID }}
          ISS: ${{ secrets.APPLE_API_ISSUER_ID }}
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$TEAM" ] && [ -n "$KID" ] && [ -n "$ISS" ] && [ -n "$P8" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=iOS::Apple secret'lari (APPLE_TEAM_ID, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_API_KEY_P8) yo'q — faqat simulyator build qilindi, TestFlight'ga yuklanmadi."
          fi

      # App Store Connect API kaliti (.p8): secret'da xom matn yoki base64 bo'lishi mumkin
      - name: Imzolangan arxiv va App Store Connect'ga yuklash
        if: steps.apple.outputs.ok == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.APPLE_API_KEY_ID }}
          ISS: ${{ secrets.APPLE_API_ISSUER_ID }}
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          TEAM=$(printf '%s' "$TEAM" | tr -d '[:space:]')
          KID=$(printf '%s' "$KID" | tr -d '[:space:]')
          ISS=$(printf '%s' "$ISS" | tr -d '[:space:]')
          KEY="$RUNNER_TEMP/AuthKey_${KID}.p8"
          if printf '%s' "$P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$P8" > "$KEY"
          else
            printf '%s' "$P8" | tr -d '[:space:]' | base64 --decode > "$KEY"
          fi
          grep -q 'BEGIN PRIVATE KEY' "$KEY" || { echo "::error::APPLE_API_KEY_P8 yaroqli .p8 kalit emas"; exit 1; }
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS")

          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            "${AUTH[@]}" archive | tail -40

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/export \
            "${AUTH[@]}" | tail -40
          rm -f "$KEY"
          {
            echo "## iOS ${MARKETING_VERSION} (build ${BUILD_NUMBER})"
            echo ""
            echo "App Store Connect'ga yuklandi → TestFlight'da 5–30 daqiqada paydo bo'ladi (bundle id: uz.hasharchilar.app)."
          } >> "$GITHUB_STEP_SUMMARY"
