<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>hasharchilar.uz — Birgalikda obod qilamiz</title>
    <meta
      name="description"
      content="Mahallangizdagi tozalash va ko'kalamzorlashtirish hasharlarini xaritada toping, bir bosishda qo'shiling yoki o'zingiz e'lon qiling."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Mavzu (tungi rejim + rang aksenti): birinchi chizishdan oldin — oq "chaqnash" va rang sakrashi bo'lmasin -->
    <script>
      (function () {
        try {
          var r = document.documentElement;
          var p = localStorage.getItem('hashar_theme');
          var a = localStorage.getItem('hashar_accent');
          if (!/^(zumrad|okean|shafaq|binafsha)$/.test(a || '')) a = 'zumrad';
          r.setAttribute('data-accent', a);
          var d = p === 'dark' || (p !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
          if (d && !/^#\/?admin/.test(location.hash)) {
            r.classList.add('dark');
            var bar = { zumrad: '#0e1a16', okean: '#0d1820', shafaq: '#1b1310', binafsha: '#13101e' }[a];
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', bar);
          }
        } catch (e) {}
      })();
    </script>

    <!-- Open Graph / ijtimoiy tarmoqlar -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="hasharchilar.uz" />
    <meta property="og:locale" content="uz_UZ" />
    <meta property="og:title" content="hasharchilar.uz — Birgalikda obod qilamiz" />
    <meta
      property="og:description"
      content="Mahallangizdagi hasharlarni xaritada toping, bir bosishda qo'shiling yoki yangisini e'lon qiling."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Saytdan foydalanish uchun JavaScript'ni yoqing.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
